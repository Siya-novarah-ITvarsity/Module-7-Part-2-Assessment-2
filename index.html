        function getCurrenttime(utcOffset){
            let time = new Date(Date.now() + utcOffset * 60 * 60 * 1000);
            return time.toLocaleTimeString(undefined, {timeZone: "UTC"});
        }
        function displayWorldtime(){
            let dt = new Date();
            document.getElementById("local").textContent = "Local Time: " + dt.toLocaleTimeString();
            for (let i = 0; i < cities.length; i++) {
                document.getElementById("time-" + i).textContent = getCurrenttime(cities[i].utcOffset);
            }
        }

        let output = '<table id="cities">';
        output += '<tr><th class="col"></th><th class="col2"></th><th></th></tr>';
        for (let i = 0; i < cities.length; i++) {
            let city = cities[i];
            output += '<tr>';
            output += '<td class="col"><img src="images/' + city.flag + '" alt="' + city.name + ' Flag" class="flag"></td>';
            output += '<td class="col2">' + city.name + '</td>';
            output += '<td id="time-' + i + '">' + getCurrenttime(city.utcOffset) + '</td>';
            output += '</tr>';
        }
        output += '</table>';
        document.getElementById("output").innerHTML = output;

        displayWorldtime();
        setInterval(displayWorldtime, 1000);
